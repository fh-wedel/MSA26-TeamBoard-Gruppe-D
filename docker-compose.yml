name: teamboard

networks:
  teamboard-net:
    driver: bridge
    name: teamboard-net

volumes:
  postgres-data:
  redis-data:
  rabbitmq-data:
  minio-data:

services:
  # =========================================================
  # INFRASTRUCTURE
  # =========================================================

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: teamboard
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./scripts/postgres-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - teamboard-net

  redis:
    image: redis:7.2-alpine
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - teamboard-net

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - teamboard-net

  minio:
    image: minio/minio:RELEASE.2024-08-17T01-24-54Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      # 9000 stays public so the browser can fetch presigned document URLs.
      - "9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - teamboard-net

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://minio:9000 $MINIO_ROOT_USER $MINIO_ROOT_PASSWORD &&
        mc mb --ignore-existing local/teamboard-documents &&
        echo "MinIO initialized"
    networks:
      - teamboard-net
    restart: "no"

  migrate:
    image: postgres:16-alpine
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./scripts/run-migrations.sh:/run-migrations.sh:ro
      - ./services/auth/migrations:/migrations/auth:ro
      - ./services/project/migrations:/migrations/project:ro
      - ./services/task/migrations:/migrations/task:ro
      - ./services/document/migrations:/migrations/document:ro
      - ./services/notification/migrations:/migrations/notification:ro
      - ./services/plugin/migrations:/migrations/plugin:ro
      - ./services/boardregistry/migrations:/migrations/boardregistry:ro
    entrypoint: /bin/sh
    command: /run-migrations.sh
    networks:
      - teamboard-net
    restart: "no"

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"
    networks:
      - teamboard-net

  jaeger:
    image: jaegertracing/all-in-one:1.55
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
    networks:
      - teamboard-net

  traefik:
    image: traefik:v3.0
    # Static config (providers, entrypoints, edge middlewares) is driven by
    # infra/traefik/traefik.yml, which Traefik auto-loads from /etc/traefik.
    command:
      - --api.insecure=true
      - --providers.docker=true
      - --providers.docker.exposedbydefault=false
      - --entrypoints.web.address=:80
      - --accesslog=true
    ports:
      - "80:80"
      # Dashboard runs with --api.insecure=true; keep it loopback-only.
      - "127.0.0.1:8080:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./infra/traefik:/etc/traefik:ro
    networks:
      - teamboard-net

  # =========================================================
  # DOMAIN SERVICES
  # =========================================================

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
      target: production
    environment:
      SERVICE_NAME: auth-service
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/auth_db?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: teamboard.events
      JWT_ISSUER: https://auth.teamboard.local
      JWT_AUDIENCE: teamboard-api
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL: 720h
      PASSWORD_MIN_LEN: "12"
      PASSWORD_MAX_LEN: "128"
      REDIS_URL: redis://redis:6379/0
      SMTP_HOST: mailhog
      SMTP_PORT: "1025"
      SMTP_FROM: noreply@teamboard.local
      PASSWORD_RESET_TTL: 1h
      PASSWORD_RESET_URL: http://localhost:3000/reset-password
      KEY_ENCRYPTION_KEY: ${KEY_ENCRYPTION_KEY}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8001/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - "traefik.http.routers.auth.rule=PathPrefix(`/api/v1/auth`) || PathPrefix(`/.well-known`) || PathPrefix(`/auth`)"
      - traefik.http.services.auth.loadbalancer.server.port=8001
    networks:
      - teamboard-net

  project:
    build:
      context: .
      dockerfile: services/project/Dockerfile
      target: production
    environment:
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/project_db?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RABBIT_EXCHANGE: teamboard.events
      RABBIT_QUEUE: project-service
      REDIS_URL: redis://redis:6379/1
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET}
      JWT_JWKS_URL: http://auth:8001/.well-known/jwks.json
      BOARDREGISTRY_SERVICE_URL: http://boardregistry:8007
      OTEL_ENDPOINT: http://jaeger:4317
    depends_on:
      migrate:
        condition: service_completed_successfully
      auth:
        condition: service_healthy
      boardregistry:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8002/healthz/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - "traefik.http.routers.project.rule=PathPrefix(`/api/v1/projects`) || PathPrefix(`/api/v1/boards`) || PathPrefix(`/api/v1/invitations`) || PathPrefix(`/project`)"
      - traefik.http.services.project.loadbalancer.server.port=8002
    networks:
      - teamboard-net

  task:
    build:
      context: .
      dockerfile: services/task/Dockerfile
      target: production
    environment:
      LOG_LEVEL: info
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/task_db?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RABBIT_EXCHANGE: teamboard.events
      RABBIT_QUEUE: task-service
      PROJECT_SERVICE_URL: http://project:8002
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET}
      JWT_JWKS_URL: http://auth:8001/.well-known/jwks.json
      OTEL_ENDPOINT: http://jaeger:4317
    depends_on:
      migrate:
        condition: service_completed_successfully
      project:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8003/healthz/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - "traefik.http.routers.task.rule=PathPrefix(`/api/v1/tasks`) || PathPrefix(`/api/v1/comments`) || PathRegexp(`^/api/v1/boards/[^/]+/tasks`) || PathPrefix(`/task`)"
      - "traefik.http.routers.task.priority=100"
      - traefik.http.services.task.loadbalancer.server.port=8003
    networks:
      - teamboard-net

  document:
    build:
      context: .
      dockerfile: services/document/Dockerfile
      target: production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/document_db?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: teamboard.events
      RABBITMQ_QUEUE: document-service
      S3_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      S3_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      S3_INTERNAL_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      PROJECT_SERVICE_URL: http://project:8002
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET}
      JWT_JWKS_URL: http://auth:8001/.well-known/jwks.json
    depends_on:
      migrate:
        condition: service_completed_successfully
      project:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8004/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - "traefik.http.routers.document.rule=PathPrefix(`/api/v1/documents`) || PathPrefix(`/document`)"
      - traefik.http.services.document.loadbalancer.server.port=8004
    networks:
      - teamboard-net

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
      target: production
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/notification_db?sslmode=disable
      REDIS_URL: redis://redis:6379/2
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: teamboard.events
      RABBITMQ_QUEUE: notification-service
      JWT_JWKS_URL: http://auth:8001/.well-known/jwks.json
      JWT_ISSUER: https://auth.teamboard.local
      PROJECT_SERVICE_URL: http://project:8002
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully
      project:
        condition: service_healthy
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8005/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - "traefik.http.routers.notification.rule=PathPrefix(`/api/v1/notifications`) || PathPrefix(`/ws`) || PathPrefix(`/notification`)"
      - traefik.http.services.notification.loadbalancer.server.port=8005
    networks:
      - teamboard-net

  plugin:
    build:
      context: .
      dockerfile: services/plugin/Dockerfile
      target: production
    environment:
      SERVICE_NAME: plugin-service
      SERVICE_PORT: "8006"
      LOG_LEVEL: info
      DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/plugin_db?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: teamboard.events
      RABBITMQ_CONSUMER_QUEUE: plugin-service-queue
      # Subscribe to all domain events; the webhook dispatcher filters per
      # registered webhook event_filter (see ARCHITECTURE §7.2).
      RABBITMQ_BINDING_KEYS: "#"
      JWT_JWKS_URL: http://auth:8001/.well-known/jwks.json
      JWT_ISSUER: https://auth.teamboard.local
      JWT_AUDIENCE: teamboard-api
      PROJECT_SERVICE_URL: http://project:8002
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET}
      ALLOW_INSECURE_HTTP: "true"
      ALLOW_PRIVATE_URLS: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      OTEL_SERVICE_NAME: plugin-service
    depends_on:
      migrate:
        condition: service_completed_successfully
      project:
        condition: service_healthy
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8006/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - "traefik.http.routers.plugin.rule=PathPrefix(`/api/v1/webhooks`) || PathRegexp(`^/api/v1/projects/[^/]+/webhooks`) || PathPrefix(`/plugin`)"
      - "traefik.http.routers.plugin.priority=100"
      - traefik.http.services.plugin.loadbalancer.server.port=8006
    networks:
      - teamboard-net

  boardregistry:
    build:
      context: .
      dockerfile: services/boardregistry/Dockerfile
      target: production
    environment:
      SERVICE_NAME: boardregistry-service
      SERVICE_PORT: "8007"
      LOG_LEVEL: info
      DB_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/boardregistry_db?sslmode=disable
      RABBITMQ_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@rabbitmq:5672/
      RABBITMQ_EXCHANGE: teamboard.events
      SERVICE_TOKEN_SECRET: ${SERVICE_TOKEN_SECRET}
      JWT_JWKS_URL: http://auth:8001/.well-known/jwks.json
    depends_on:
      migrate:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:8007/healthz/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      - traefik.enable=true
      - "traefik.http.routers.boardregistry.rule=PathPrefix(`/api/v1/board-types`) || PathPrefix(`/board-registry`)"
      - traefik.http.services.boardregistry.loadbalancer.server.port=8007
    networks:
      - teamboard-net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: production
    ports:
      # Local dev only; in prod the frontend is served through Traefik on :80.
      - "127.0.0.1:3000:3000"
    depends_on:
      - traefik
    networks:
      - teamboard-net

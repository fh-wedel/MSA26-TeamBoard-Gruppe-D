api:
  dashboard: true
  insecure: true

log:
  level: INFO

# Structured access log; never log credential-bearing headers in clear.
# NOTE: tokens passed as a query parameter (e.g. the WebSocket `/ws?token=...`)
# still appear in the logged request URI — Traefik cannot redact query strings.
# Tracked in docs/TODO.md (move the WS token out of the query string).
accessLog:
  format: json
  fields:
    headers:
      defaultMode: keep
      names:
        Authorization: redact
        Cookie: redact

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: teamboard-net
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

entryPoints:
  web:
    address: ":80"
    # Harden every routed service at the edge (middlewares defined in dynamic.yml).
    http:
      middlewares:
        - secure-headers@file
        - cors@file
        - ratelimit@file
  websecure:
    address: ":443"
    # Terminate TLS for every router attached to this entrypoint.
    #
    # Locally (this file only): no certResolver, so Traefik serves its built-in
    # self-signed default cert — fine for a box reached by bare IP.
    #
    # In production the ACME resolver + cert domain are layered on via TRAEFIK_*
    # env vars in docker-compose.prod.yml (Let's Encrypt for ${PUBLIC_HOST}.sslip.io,
    # TLS-ALPN-01 challenge). That merges into this same `tls` block at runtime, so
    # the deployed box gets a real, publicly-trusted cert on :443. See that file.
    http:
      tls: {}
      middlewares:
        - secure-headers@file
        - cors@file
        - ratelimit@file

api:
  dashboard: true
  insecure: true

log:
  level: INFO

# Structured access log; never log credential-bearing headers in clear.
# NOTE: tokens passed as a query parameter (e.g. the WebSocket `/ws?token=...`)
# still appear in the logged request URI — Traefik cannot redact query strings.
# Tracked in docs/TODO.md (move the WS token out of the query string).
accessLog:
  format: json
  fields:
    headers:
      defaultMode: keep
      names:
        Authorization: redact
        Cookie: redact

providers:
  docker:
    endpoint: "unix:///var/run/docker.sock"
    exposedByDefault: false
    network: teamboard-net
  file:
    filename: /etc/traefik/dynamic.yml
    watch: true

entryPoints:
  web:
    address: ":80"
    # Harden every routed service at the edge (middlewares defined in dynamic.yml).
    http:
      middlewares:
        - secure-headers@file
        - cors@file
        - ratelimit@file
  websecure:
    address: ":443"
    # Terminate TLS for every router attached to this entrypoint.
    #
    # With no matching ACME cert, Traefik serves its built-in self-signed default
    # cert (what you get locally, or via the bare IP in prod). In production the
    # `letsencrypt` resolver below is *activated* by the `acme` router that
    # docker-compose.prod.yml attaches to the frontend service: its Host()
    # matcher (${PUBLIC_HOST}.sslip.io) is what makes Traefik request a cert.
    # The issued cert is then served for that SNI on this entrypoint.
    http:
      tls: {}
      middlewares:
        - secure-headers@file
        - cors@file
        - ratelimit@file

# Let's Encrypt certificate resolver.
#
# Defined here in the static file on purpose: a resolver added via CLI flags or
# TRAEFIK_* env vars does NOT work reliably once this file is present — the file
# takes precedence over CLI flags for static config, and env vars mangle the
# resolver's name so routers can't reference it. The file is the only reliable
# home for it.
#
# It is INERT unless a router references it (`tls.certresolver: letsencrypt`).
# Locally no router does, so Traefik never contacts Let's Encrypt — :443 just
# serves the self-signed default cert. In production the `acme` router from
# docker-compose.prod.yml activates it (see that file).
#
# storage lives on a writable volume (traefik-acme -> /acme, mounted by the
# compose file); the directory must exist or the resolver is skipped at startup.
certificatesResolvers:
  letsencrypt:
    acme:
      email: stud106022@fh-wedel.de
      storage: /acme/acme.json
      # TLS-ALPN-01: solved on :443 at the TLS layer, so it never collides with
      # the auth service's PathPrefix(`/.well-known`) HTTP router. Requires :443
      # reachable from the internet (it is, via the EC2 security group).
      tlsChallenge: {}

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 1140" width="1440" height="1140" font-family="'Segoe UI', system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif">
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.12"/>
    </filter>
    <marker id="ah-indigo" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto-start-reverse"><path d="M0,0 L7,3 L0,6 Z" fill="#6366f1"/></marker>
    <marker id="ah-sky" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto-start-reverse"><path d="M0,0 L7,3 L0,6 Z" fill="#38bdf8"/></marker>
    <marker id="ah-cyan" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto-start-reverse"><path d="M0,0 L7,3 L0,6 Z" fill="#06b6d4"/></marker>
    <marker id="ah-orange" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto-start-reverse"><path d="M0,0 L7,3 L0,6 Z" fill="#ea7317"/></marker>
    <marker id="ah-gray" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto-start-reverse"><path d="M0,0 L7,3 L0,6 Z" fill="#94a3b8"/></marker>
  </defs>

  <!-- ============ background ============ -->
  <rect x="0" y="0" width="1440" height="1140" fill="#f5f7fb"/>

  <!-- ============ title ============ -->
  <text x="44" y="52" font-size="27" font-weight="700" fill="#0f172a">TeamBoard — Microservice Architecture</text>
  <text x="44" y="80" font-size="14" fill="#64748b">Go · Chi · sqlc · PostgreSQL 16 · Redis 7 · RabbitMQ 3.12 · Traefik   ·   async via teamboard.events (Outbox + Envelope)   ·   MCP protocol adapter (PAT)</text>
  <text x="1396" y="52" font-size="12" fill="#94a3b8" text-anchor="end">current · 2026-07-14</text>

  <!-- ============ persistence (drawn first, tucked behind the event-bus bar) ============ -->
  <g stroke="#94a3b8" fill="none">
    <!-- PostgreSQL: representative lines (all seven domain services persist; see card) -->
    <!-- <path d="M290,474 Q300,590 342,700" stroke-width="2" marker-end="url(#ah-gray)"/>
    <path d="M461,474 Q430,590 350,700" stroke-width="1.6" opacity="0.55" marker-end="url(#ah-gray)"/> -->
    <!-- Redis: permission cache + WS backplane -->
    <path d="M290,474 Q470,600 712,700" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#ah-gray)"/>
    <path d="M803,474 Q770,600 726,700" stroke-width="1.8" stroke-dasharray="2 4" marker-end="url(#ah-gray)"/>
    <!-- MinIO / S3: document blobs -->
    <path d="M632,474 Q820,600 1092,700" stroke-width="2" marker-end="url(#ah-gray)"/> -->
  </g>

  <!-- ============ event-bus bar (covers persistence middles) ============ -->
  <rect x="40" y="520" width="1188" height="64" rx="16" fill="#fff4ea" stroke="#f4a259" stroke-width="1.5" filter="url(#shadow)"/>
  <rect x="40" y="520" width="1188" height="6" rx="3" fill="#ea7317"/>
  <text x="720" y="550" font-size="15" font-weight="700" fill="#9a4a06" text-anchor="middle">RabbitMQ · teamboard.events (topic exchange)  +  .dlx (dead-letter)</text>
  <text x="720" y="571" font-size="12" fill="#b45309" text-anchor="middle">shared Outbox.Worker → publish (broker confirms)   ·   Envelope   ·   consume (idempotent · processed_events)</text>

  <!-- ============ event connectors: domain services ⇄ bus (short parallel stubs) ============ -->
  <g stroke="#ea7317" fill="none" stroke-width="2.4">
    <path d="M119.5,474 L119.5,520" marker-end="url(#ah-orange)"/>                                   <!-- Auth: pub -->
    <path d="M290.5,474 L290.5,520" marker-start="url(#ah-orange)" marker-end="url(#ah-orange)"/>     <!-- Project -->
    <path d="M461.5,474 L461.5,520" marker-start="url(#ah-orange)" marker-end="url(#ah-orange)"/>     <!-- Task -->
    <path d="M632.5,474 L632.5,520" marker-start="url(#ah-orange)" marker-end="url(#ah-orange)"/>     <!-- Document -->
    <path d="M803.5,474 L803.5,520" marker-start="url(#ah-orange)" marker-end="url(#ah-orange)"/>     <!-- Notification -->
    <path d="M974.5,474 L974.5,520" marker-start="url(#ah-orange)" marker-end="url(#ah-orange)"/>     <!-- Plugin -->
    <path d="M1145.5,474 L1145.5,520" marker-end="url(#ah-orange)"/>                                  <!-- Board Registry: pub -->
  </g>

  <!-- ============ data stores ============ -->
  <g filter="url(#shadow)"><rect x="180" y="700" width="330" height="116" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="180" y="700" width="330" height="6" rx="3" fill="#2f6f9f"/></g>
  <text x="200" y="736" font-size="15" font-weight="700" fill="#1e293b">🗄  PostgreSQL 16</text>
  <text x="200" y="759" font-size="11" fill="#475569">one logical DB per domain service</text>
  <!-- <text x="200" y="776" font-size="10.5" fill="#64748b">auth · project · task · document · notification · plugin · boardregistry</text> -->
  <text x="200" y="781" font-size="10.5" font-weight="600" fill="#2f6f9f">SQL write + Outbox event · one transaction</text>

  <g filter="url(#shadow)"><rect x="555" y="700" width="330" height="116" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="555" y="700" width="330" height="6" rx="3" fill="#dc2626"/></g>
  <text x="575" y="736" font-size="15" font-weight="700" fill="#1e293b">⚡  Redis 7</text>
  <text x="575" y="759" font-size="11" fill="#475569">permission cache · TTL 30s (invalidated on project.member.*)</text>
  <text x="575" y="781" font-size="11" fill="#475569">WebSocket backplane (pub/sub)</text>

  <g filter="url(#shadow)"><rect x="930" y="700" width="330" height="116" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="930" y="700" width="330" height="6" rx="3" fill="#c026d3"/></g>
  <text x="950" y="736" font-size="15" font-weight="700" fill="#1e293b">🪣  MinIO / S3</text>
  <text x="950" y="759" font-size="11" fill="#475569">document object storage</text>
  <text x="950" y="781" font-size="11" fill="#475569">pre-signed upload / download · versioned blobs</text>

  <!-- ============ client nodes (symmetric about the gateway centre, x=720) ============ -->
  <g filter="url(#shadow)"><rect x="360" y="120" width="240" height="68" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="360" y="120" width="240" height="6" rx="3" fill="#6366f1"/></g>
  <text x="480" y="152" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">🌐  Browser</text>
  <text x="480" y="172" font-size="11.5" fill="#64748b" text-anchor="middle">React SPA · view registry (board views)</text>

  <g filter="url(#shadow)"><rect x="840" y="120" width="240" height="68" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="840" y="120" width="240" height="6" rx="3" fill="#6366f1"/></g>
  <text x="960" y="152" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">🤖  MCP Client</text>
  <text x="960" y="172" font-size="11.5" fill="#64748b" text-anchor="middle">Some Agent</text>

  <!-- client ⇄ gateway (both via Traefik; WebSocket is a /ws pass-through, not a direct link) -->
  <path d="M480,188 L480,236" stroke="#6366f1" stroke-width="2.4" fill="none" marker-start="url(#ah-indigo)" marker-end="url(#ah-indigo)"/>
  <text x="492" y="216" font-size="11" fill="#4f46e5">HTTPS · WebSocket (/ws)</text>
  <path d="M960,188 L960,236" stroke="#6366f1" stroke-width="2.4" fill="none" marker-start="url(#ah-indigo)" marker-end="url(#ah-indigo)"/>
  <text x="972" y="216" font-size="11" fill="#4f46e5">MCP /mcp · Bearer PAT</text>

  <!-- ============ API Gateway (single entry — everything routes through here) ============ -->
  <g filter="url(#shadow)"><rect x="40" y="236" width="1360" height="64" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="40" y="236" width="1360" height="6" rx="3" fill="#0ea5e9"/></g>
  <text x="60" y="268" font-size="15.5" font-weight="700" fill="#1e293b">Traefik API Gateway</text>
  <rect x="228" y="252" width="86" height="22" rx="11" fill="#e0f2fe"/><text x="271" y="267" font-size="12" font-weight="700" fill="#0369a1" text-anchor="middle">:80 / :443</text>
  <text x="60" y="290" font-size="11.5" fill="#64748b">TLS-termination (443 self-signed) · routing · rate limiting · CORS · security headers   —   JWT / PAT validated per-service, not here (Zero-Trust)</text>

  <!-- ============ routing: gateway → services (short parallel stubs) ============ -->
  <g stroke="#38bdf8" fill="none" stroke-width="1.6" opacity="0.9">
    <path d="M119.5,300 L119.5,346" marker-end="url(#ah-sky)"/>
    <path d="M290.5,300 L290.5,346" marker-end="url(#ah-sky)"/>
    <path d="M461.5,300 L461.5,346" marker-end="url(#ah-sky)"/>
    <path d="M632.5,300 L632.5,346" marker-end="url(#ah-sky)"/>
    <path d="M803.5,300 L803.5,346" marker-end="url(#ah-sky)"/>
    <path d="M974.5,300 L974.5,346" marker-end="url(#ah-sky)"/>
    <path d="M1145.5,300 L1145.5,346" marker-end="url(#ah-sky)"/>
  </g>
  <!-- MCP is a Traefik-routed backend: /mcp in, /api/v1 back out — the only bidirectional edge -->
  <path d="M1316.5,300 L1316.5,346" stroke="#06b6d4" stroke-width="2.6" fill="none" marker-start="url(#ah-cyan)" marker-end="url(#ah-cyan)"/>
  <text x="1230" y="322" font-size="9.5" fill="#0e7490" text-anchor="middle">/mcp  ⇄  /api/v1 · PAT</text>

  <!-- ============ service row (7 domain services + MCP adapter, same level) ============ -->

  <!-- Auth -->
  <g filter="url(#shadow)"><rect x="40" y="346" width="159" height="128" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="40" y="346" width="159" height="6" rx="3" fill="#10b981"/></g>
  <text x="56" y="380" font-size="14" font-weight="700" fill="#1e293b">Auth</text>
  <rect x="147" y="364" width="44" height="20" rx="10" fill="#d1fae5"/><text x="169" y="378" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">8001</text>
  <text x="56" y="404" font-size="10.5" fill="#475569">JWT · login · JWKS</text>
  <text x="56" y="420" font-size="10.5" fill="#475569">PAT issue · introspect</text>
  <text x="56" y="460" font-size="10" font-weight="700" fill="#ea7317">pub</text>

  <!-- Project (authoritative) -->
  <g filter="url(#shadow)"><rect x="211" y="346" width="159" height="128" rx="14" fill="#ffffff" stroke="#ddd6fe"/><rect x="211" y="346" width="159" height="6" rx="3" fill="#8b5cf6"/></g>
  <text x="227" y="380" font-size="14" font-weight="700" fill="#1e293b">Project</text>
  <rect x="318" y="364" width="44" height="20" rx="10" fill="#ede9fe"/><text x="340" y="378" font-size="11" font-weight="700" fill="#6d28d9" text-anchor="middle">8002</text>
  <text x="227" y="404" font-size="10.5" fill="#475569">Projects · Boards</text>
  <text x="227" y="420" font-size="10.5" fill="#475569">Members</text>
  <text x="227" y="439" font-size="10" font-weight="700" fill="#7c3aed">★ permission authority</text>
  <text x="227" y="460" font-size="10" font-weight="700" fill="#ea7317">pub · sub</text>

  <!-- Task -->
  <g filter="url(#shadow)"><rect x="382" y="346" width="159" height="128" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="382" y="346" width="159" height="6" rx="3" fill="#10b981"/></g>
  <text x="398" y="380" font-size="14" font-weight="700" fill="#1e293b">Task</text>
  <rect x="489" y="364" width="44" height="20" rx="10" fill="#d1fae5"/><text x="511" y="378" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">8003</text>
  <text x="398" y="404" font-size="10.5" fill="#475569">Tasks · Comments</text>
  <text x="398" y="420" font-size="10.5" fill="#475569">status transitions</text>
  <text x="398" y="460" font-size="10" font-weight="700" fill="#ea7317">pub · sub</text>

  <!-- Document -->
  <g filter="url(#shadow)"><rect x="553" y="346" width="159" height="128" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="553" y="346" width="159" height="6" rx="3" fill="#10b981"/></g>
  <text x="569" y="380" font-size="14" font-weight="700" fill="#1e293b">Document</text>
  <rect x="660" y="364" width="44" height="20" rx="10" fill="#d1fae5"/><text x="682" y="378" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">8004</text>
  <text x="569" y="404" font-size="10.5" fill="#475569">Metadata · Versions</text>
  <text x="569" y="420" font-size="10.5" fill="#475569">pre-signed URLs</text>
  <text x="569" y="460" font-size="10" font-weight="700" fill="#ea7317">pub · sub</text>

  <!-- Notification -->
  <g filter="url(#shadow)"><rect x="724" y="346" width="159" height="128" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="724" y="346" width="159" height="6" rx="3" fill="#10b981"/></g>
  <text x="740" y="380" font-size="14" font-weight="700" fill="#1e293b">Notification</text>
  <rect x="831" y="364" width="44" height="20" rx="10" fill="#d1fae5"/><text x="853" y="378" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">8005</text>
  <text x="740" y="404" font-size="10.5" fill="#475569">WebSocket push (/ws)</text>
  <text x="740" y="420" font-size="10.5" fill="#475569">persistent notifs</text>
  <text x="740" y="460" font-size="10" font-weight="700" fill="#ea7317">pub · sub</text>

  <!-- Plugin -->
  <g filter="url(#shadow)"><rect x="895" y="346" width="159" height="128" rx="14" fill="#ffffff" stroke="#e2e8f0"/><rect x="895" y="346" width="159" height="6" rx="3" fill="#10b981"/></g>
  <text x="911" y="380" font-size="14" font-weight="700" fill="#1e293b">Plugin</text>
  <rect x="1002" y="364" width="44" height="20" rx="10" fill="#d1fae5"/><text x="1024" y="378" font-size="11" font-weight="700" fill="#047857" text-anchor="middle">8006</text>
  <text x="911" y="404" font-size="10.5" fill="#475569">Webhook registry</text>
  <text x="911" y="420" font-size="10.5" fill="#475569">HMAC · retry · breaker</text>
  <text x="911" y="460" font-size="10" font-weight="700" fill="#ea7317">pub · sub</text>

  <!-- Board Registry (authoritative) -->
  <g filter="url(#shadow)"><rect x="1066" y="346" width="159" height="128" rx="14" fill="#ffffff" stroke="#ddd6fe"/><rect x="1066" y="346" width="159" height="6" rx="3" fill="#8b5cf6"/></g>
  <text x="1082" y="380" font-size="13" font-weight="700" fill="#1e293b">Board Registry</text>
  <rect x="1173" y="364" width="44" height="20" rx="10" fill="#ede9fe"/><text x="1195" y="378" font-size="11" font-weight="700" fill="#6d28d9" text-anchor="middle">8007</text>
  <text x="1082" y="404" font-size="10.5" fill="#475569">Board-type defs</text>
  <text x="1082" y="420" font-size="10.5" fill="#475569">presentation specs</text>
  <text x="1082" y="439" font-size="10" font-weight="700" fill="#7c3aed">★ runtime registration</text>
  <text x="1082" y="460" font-size="10" font-weight="700" fill="#ea7317">pub</text>

  <!-- MCP Server (protocol adapter — same level, but no DB / no events; talks only to Traefik) -->
  <g filter="url(#shadow)"><rect x="1237" y="346" width="159" height="128" rx="14" fill="#ffffff" stroke="#cffafe"/><rect x="1237" y="346" width="159" height="6" rx="3" fill="#06b6d4"/></g>
  <text x="1253" y="380" font-size="14" font-weight="700" fill="#1e293b">MCP Server</text>
  <rect x="1348" y="364" width="40" height="20" rx="10" fill="#cffafe"/><text x="1368" y="378" font-size="10.5" font-weight="700" fill="#0e7490" text-anchor="middle">/mcp</text>
  <text x="1253" y="404" font-size="10.5" fill="#475569">MCP ↔ REST</text>
  <text x="1253" y="420" font-size="10" font-weight="700" fill="#0e7490">protocol adapter (BFF)</text>
  <text x="1253" y="439" font-size="10" fill="#94a3b8">no DB · no events</text>
  <text x="1253" y="460" font-size="10" font-weight="700" fill="#0e7490">Auth: Personal Access Token</text>

  <!-- ============ legend ============ -->
  <rect x="40" y="864" width="1360" height="232" rx="16" fill="#ffffff" stroke="#e2e8f0" filter="url(#shadow)"/>
  <text x="64" y="896" font-size="14" font-weight="700" fill="#0f172a" letter-spacing="0.5">LEGEND</text>

  <g stroke-width="2.6" fill="none">
    <path d="M64,922 L120,922" stroke="#6366f1" marker-start="url(#ah-indigo)" marker-end="url(#ah-indigo)"/>
    <path d="M64,952 L120,952" stroke="#38bdf8" marker-end="url(#ah-sky)"/>
    <path d="M64,982 L120,982" stroke="#06b6d4" marker-start="url(#ah-cyan)" marker-end="url(#ah-cyan)"/>
    <path d="M64,1012 L120,1012" stroke="#ea7317" marker-start="url(#ah-orange)" marker-end="url(#ah-orange)"/>
    <path d="M64,1042 L120,1042" stroke="#94a3b8" stroke-dasharray="2 4" marker-end="url(#ah-gray)"/>
  </g>
  <text x="134" y="926" font-size="12" fill="#334155">Client edge — HTTPS request / WebSocket, both through the gateway (/ws pass-through)</text>
  <text x="134" y="956" font-size="12" fill="#334155">Gateway routing — CORS · rate-limit · security headers (JWT/PAT validated per-service)</text>
  <text x="134" y="986" font-size="12" fill="#334155">MCP adapter ⇄ gateway — /mcp in, /api/v1 back out (forwards Bearer PAT)</text>
  <text x="134" y="1016" font-size="12" fill="#334155">Async domain event — Outbox → RabbitMQ → consumer (double head = pub · sub)</text>
  <text x="134" y="1046" font-size="12" fill="#334155">Persistence — DB · cache · object store</text>

  <!-- <line x1="720" y1="884" x2="720" y2="1076" stroke="#e2e8f0"/>
  <text x="748" y="900" font-size="12.5" font-weight="700" fill="#0f172a">Cross-cutting patterns &amp; internal calls</text>
  <text x="748" y="924" font-size="11.5" fill="#475569">• Synchronous internal calls (service-token · cached 30s): all services →</text>
  <text x="760" y="940" font-size="11.5" fill="#475569">Project (permissions) · Project → Board Registry (board-types) · → Auth (PAT).</text>
  <text x="748" y="962" font-size="11.5" fill="#475569">• PAT: long-lived, revocable user token; services resolve tbpat_ via Auth</text>
  <text x="760" y="978" font-size="11.5" fill="#475569">/internal/tokens/introspect (cache 30s) — see auth.md §17.</text>
  <text x="748" y="1000" font-size="11.5" fill="#475569">• MCP server: protocol adapter (BFF / ACL), not a domain service — no DB,</text>
  <text x="760" y="1016" font-size="11.5" fill="#475569">no events; talks only to Traefik and acts on-behalf-of the user's PAT.</text>
  <text x="748" y="1038" font-size="11.5" fill="#475569">• Transactional Outbox · Envelope · Idempotency (processed_events · .dlx).</text>
  <text x="748" y="1062" font-size="11.5" fill="#7c3aed">★ authoritative source of truth for its domain.</text> -->
</svg>

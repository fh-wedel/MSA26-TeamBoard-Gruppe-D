services:
  auth:
    build:
      context: .
      dockerfile: services/domain/auth/Dockerfile
      target: dev
    volumes:
      - ./services/domain/auth:/workspace/services/domain/auth
      - ./shared/go:/workspace/shared/go
      - go-mod-cache:/go/pkg/mod
    command: air -c .air.toml

  project:
    build:
      context: .
      dockerfile: services/domain/project/Dockerfile
      target: dev
    volumes:
      - ./services/domain/project:/workspace/services/domain/project
      - ./shared/go:/workspace/shared/go
      - go-mod-cache:/go/pkg/mod
    command: air -c .air.toml

  task:
    build:
      context: .
      dockerfile: services/domain/task/Dockerfile
      target: dev
    volumes:
      - ./services/domain/task:/workspace/services/domain/task
      - ./shared/go:/workspace/shared/go
      - go-mod-cache:/go/pkg/mod
    command: air -c .air.toml

  document:
    build:
      context: .
      dockerfile: services/domain/document/Dockerfile
      target: dev
    volumes:
      - ./services/domain/document:/workspace/services/domain/document
      - ./shared/go:/workspace/shared/go
      - go-mod-cache:/go/pkg/mod
    command: air -c .air.toml

  notification:
    build:
      context: .
      dockerfile: services/domain/notification/Dockerfile
      target: dev
    volumes:
      - ./services/domain/notification:/workspace/services/domain/notification
      - ./shared/go:/workspace/shared/go
      - go-mod-cache:/go/pkg/mod
    command: air -c .air.toml

  plugin:
    build:
      context: .
      dockerfile: services/domain/plugin/Dockerfile
      target: dev
    volumes:
      - ./services/domain/plugin:/workspace/services/domain/plugin
      - ./shared/go:/workspace/shared/go
      - go-mod-cache:/go/pkg/mod
    command: air -c .air.toml

  boardregistry:
    build:
      context: .
      dockerfile: services/domain/boardregistry/Dockerfile
      target: dev
    volumes:
      - ./services/domain/boardregistry:/workspace/services/domain/boardregistry
      - ./shared/go:/workspace/shared/go
      - go-mod-cache:/go/pkg/mod
    command: air -c .air.toml

volumes:
  go-mod-cache:

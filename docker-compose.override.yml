services:
  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
      target: dev
    volumes:
      - ./services/auth:/workspace/services/auth
      - ./shared/go:/workspace/shared/go
      - go-mod-cache:/go/pkg/mod
    command: air -c .air.toml

  project:
    build:
      context: .
      dockerfile: services/project/Dockerfile
      target: dev
    volumes:
      - ./services/project:/workspace/services/project
      - ./shared/go:/workspace/shared/go
      - go-mod-cache:/go/pkg/mod
    command: air -c .air.toml

  task:

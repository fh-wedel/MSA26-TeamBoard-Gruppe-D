    volumes:
      - ./services/document:/workspace/services/document
      - ./shared/go:/workspace/shared/go
      - go-mod-cache:/go/pkg/mod
    command: air -c .air.toml

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
      target: dev
    volumes:
      - ./services/notification:/workspace/services/notification
      - ./shared/go:/workspace/shared/go
      - go-mod-cache:/go/pkg/mod
    command: air -c .air.toml

  plugin:
    build:
      context: .
      dockerfile: services/plugin/Dockerfile
      target: dev
    volumes:
      - ./services/plugin:/workspace/services/plugin
      - ./shared/go:/workspace/shared/go
      - go-mod-cache:/go/pkg/mod
    command: air -c .air.toml

  boardregistry:
    build:
      context: .
      dockerfile: services/boardregistry/Dockerfile
      target: dev
    volumes:
      - ./services/boardregistry:/workspace/services/boardregistry
      - ./shared/go:/workspace/shared/go
      - go-mod-cache:/go/pkg/mod
    command: air -c .air.toml

volumes:
  go-mod-cache:

name: Deploy Dev

on:
  push:
    branches:
      - 'dev/*'
      - 'aws-test'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: dev
    env:
      AWS_REGION: ${{ secrets.AWS_REGION }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - uses: ./.github/actions/deploy-cdk-stack
        with:
          aws-role-arn: ${{ secrets.AWS_ROLE_ARN_DEV }}
          aws-region: ${{ secrets.AWS_REGION }}
          environment: dev
          image-tag: ${{ github.sha }}
          ecr-registry: ${{ secrets.ECR_REGISTRY }}

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - aws-test

jobs:
  test:
    name: Lint, typecheck, test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        workspace:
          - services/core
          - services/plugins/kanban
          - lambdas/ws-broadcaster
          - infrastructure
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install workspace dependencies
        run: npm install --no-audit --no-fund
        working-directory: ${{ matrix.workspace }}

      - name: Typecheck
        run: npm run typecheck --if-present
        working-directory: ${{ matrix.workspace }}

      - name: Test
        run: npm test --if-present
        working-directory: ${{ matrix.workspace }}

  synth:
    name: CDK synth
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install infra
        run: npm install --no-audit --no-fund
        working-directory: infrastructure

      - name: cdk synth
        run: npx cdk synth --quiet
        working-directory: infrastructure

  docker-build:
    name: Docker build (${{ matrix.image }})
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: core
            context: services/core
          - image: plugin-kanban
            context: services/plugins/kanban
          - image: ws-broadcaster
            context: lambdas/ws-broadcaster
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          tags: msa2/${{ matrix.image }}:ci

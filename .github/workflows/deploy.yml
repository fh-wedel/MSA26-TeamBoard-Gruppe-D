name: Build & Deploy

# Runs on a push to ANY branch (as requested) and on manual dispatch.
# Single environment: the box always runs whatever was pushed last.
# To restrict to main later: on: { push: { branches: [main] } }
on:
  push:
  workflow_dispatch:

# One build+deploy at a time; a newer push cancels an older in-flight run.
concurrency:
  group: build-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push images to GHCR via GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        service: [auth, project, task, document, notification, plugin, boardregistry, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase owner            # GHCR requires a lowercase namespace
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'frontend' && './frontend' || '.' }}
          file: ${{ matrix.service == 'frontend' && 'frontend/Dockerfile' || format('services/{0}/Dockerfile', matrix.service) }}
          target: production
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/teamboard-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/teamboard-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to host (SSH)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read           # the box pulls from GHCR with this ephemeral token
    steps:
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          TAG: ${{ github.sha }}
          REGISTRY: ghcr.io/${{ env.OWNER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          # Forward these into the remote shell so deploy.sh can read them.
          envs: TAG,REGISTRY,GHCR_USER,GHCR_TOKEN
          command_timeout: 15m
          script: bash /opt/teamboard/deploy.sh

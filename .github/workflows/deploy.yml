name: Build & Deploy

# Runs on a push to ANY branch (as requested) and on manual dispatch.
# Single environment: the box always runs whatever was pushed last.
# To restrict to main later: on: { push: { branches: [main] } }
on:
  push:
  workflow_dispatch:

# One build+deploy at a time; a newer push cancels an older in-flight run.
concurrency:
  group: build-deploy
  cancel-in-progress: true

jobs:
  build:
    name: Build & push (${{ matrix.service }})
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write          # push images to GHCR via GITHUB_TOKEN
    strategy:
      fail-fast: false
      matrix:
        service: [auth, project, task, document, notification, plugin, boardregistry, frontend]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase owner            # GHCR requires a lowercase namespace
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Set build time
        run: echo "BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service == 'frontend' && './frontend' || '.' }}
          file: ${{ matrix.service == 'frontend' && 'frontend/Dockerfile' || format('services/{0}/Dockerfile', matrix.service) }}
          target: production
          push: true
          tags: |
            ghcr.io/${{ env.OWNER }}/teamboard-${{ matrix.service }}:${{ github.sha }}
            ghcr.io/${{ env.OWNER }}/teamboard-${{ matrix.service }}:latest
          build-args: |
            ${{ matrix.service == 'frontend' && format('VITE_BUILD_SHA={0}', github.sha) || '' }}
            ${{ matrix.service == 'frontend' && format('VITE_BUILD_TIME={0}', env.BUILD_TIME) || '' }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to host (SSH)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read           # the box pulls from GHCR with this ephemeral token
    steps:
      - name: Lowercase owner
        run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        env:
          TAG: ${{ github.sha }}
          REGISTRY: ghcr.io/${{ env.OWNER }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ec2-user
          key: ${{ secrets.EC2_SSH_KEY }}
          # Forward these into the remote shell so the bootstrap + deploy.sh can read them.
          envs: TAG,REGISTRY,GHCR_USER,GHCR_TOKEN,REPO
          command_timeout: 15m
          # Self-provisioning: on a fresh/reset box install git + docker + compose,
          # clone the repo with the ephemeral GITHUB_TOKEN (works for private repos),
          # sync to the pushed commit, then hand off to deploy.sh. No manual setup.
          script: |
            set -euo pipefail

            # ── tools: git + docker + compose plugin (idempotent) ──────────────
            command -v git >/dev/null 2>&1 || sudo dnf install -y git
            if ! command -v docker >/dev/null 2>&1; then
              sudo dnf install -y docker
              sudo systemctl enable --now docker
              sudo mkdir -p /usr/local/lib/docker/cli-plugins
              ARCH="$(uname -m)"   # x86_64 or aarch64
              sudo curl -fsSL "https://github.com/docker/compose/releases/latest/download/docker-compose-linux-${ARCH}" \
                -o /usr/local/lib/docker/cli-plugins/docker-compose
              sudo chmod +x /usr/local/lib/docker/cli-plugins/docker-compose
            fi
            # group membership applies to the *next* session — handled below via `sg`.
            id -nG | grep -qw docker || sudo usermod -aG docker "$(id -un)"

            # ── repo present at /opt/teamboard (token clone for private repo) ───
            if [ ! -d /opt/teamboard/.git ]; then
              sudo mkdir -p /opt/teamboard
              sudo chown "$(id -un):$(id -gn)" /opt/teamboard
              git clone "https://x-access-token:${GHCR_TOKEN}@github.com/${REPO}.git" /opt/teamboard
            fi
            # refresh auth with the current ephemeral token, then sync to this commit
            git -C /opt/teamboard remote set-url origin "https://x-access-token:${GHCR_TOKEN}@github.com/${REPO}.git"
            git -C /opt/teamboard fetch --quiet --all
            git -C /opt/teamboard checkout --quiet --force "$TAG"

            # ── deploy (use `sg` so the freshly-added docker group is active) ───
            if docker info >/dev/null 2>&1; then
              bash /opt/teamboard/deploy.sh
            else
              sg docker -c "bash /opt/teamboard/deploy.sh"
            fi

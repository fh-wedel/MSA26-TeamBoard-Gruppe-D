# Production overlay for the single-EC2 deployment.
# Used together with the base file:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d
#
# Differences vs. local dev:
#   - Domain services + frontend run from prebuilt ECR images (no build on the box).
#   - The frontend is served *through* Traefik (single public entry on port 80),
#     so it needs no public host port of its own.
#   - Webhook SSRF guards are turned ON (public box).
#   - MinIO presigned URLs + password-reset links point at the public host.
#
# Variables are supplied per-deploy by deploy.sh / CI:
#   REGISTRY     — ghcr.io/<owner>            (from CI)
#   TAG          — the git SHA                (from CI)
#   PUBLIC_HOST  — Elastic IP                 (auto-derived, or set in .env)
# App secrets (POSTGRES_PASSWORD, …) come from /opt/teamboard/.env.

volumes:
  # Persist the Let's Encrypt account key + issued certs across restarts/redeploys
  # so we never re-request on every deploy and stay well under LE rate limits.
  traefik-acme:

services:
  # Real, publicly-trusted TLS on :443 via Let's Encrypt.
  #
  # Let's Encrypt does not issue certificates for a bare IP, so we use a
  # wildcard-DNS hostname that encodes the Elastic IP:
  #     ${PUBLIC_HOST}.sslip.io   ->  resolves to ${PUBLIC_HOST}   (public DNS)
  # Traefik requests a cert for that hostname and solves the ACME TLS-ALPN-01
  # challenge on :443 itself. TLS-ALPN-01 (not HTTP-01) is deliberate: it runs at
  # the TLS layer and never touches HTTP routing, so it can't be swallowed by the
  # auth service's `PathPrefix(/.well-known)` router.
  #
  # Reach the app + MCP endpoint via  https://${PUBLIC_HOST}.sslip.io/  — the SPA
  # uses relative URLs and the Settings page derives the MCP URL from the current
  # hostname, so both pick up the valid cert automatically. (The bare IP on :443
  # still serves Traefik's self-signed default cert — use the hostname.)
  #
  # ACME static config is injected as TRAEFIK_* env vars (prod-only) so local dev
  # keeps its self-signed :443 and never attempts issuance.
  traefik:
    environment:
      TRAEFIK_CERTIFICATESRESOLVERS_letsencrypt_ACME_EMAIL: "stud106022@fh-wedel.de"
      TRAEFIK_CERTIFICATESRESOLVERS_letsencrypt_ACME_STORAGE: "/acme/acme.json"
      TRAEFIK_CERTIFICATESRESOLVERS_letsencrypt_ACME_TLSCHALLENGE: "true"
      TRAEFIK_ENTRYPOINTS_websecure_HTTP_TLS_CERTRESOLVER: "letsencrypt"
      TRAEFIK_ENTRYPOINTS_websecure_HTTP_TLS_DOMAINS_0_MAIN: "${PUBLIC_HOST}.sslip.io"
    volumes:
      - traefik-acme:/acme

  auth:
    image: ${REGISTRY}/teamboard-auth:${TAG}
    environment:
      PASSWORD_RESET_URL: http://${PUBLIC_HOST}/reset-password

  project:
    image: ${REGISTRY}/teamboard-project:${TAG}

  task:
    image: ${REGISTRY}/teamboard-task:${TAG}

  document:
    image: ${REGISTRY}/teamboard-document:${TAG}
    environment:
      # Presigned download URLs handed to the browser must use the public host.
      S3_PUBLIC_ENDPOINT: http://${PUBLIC_HOST}:9000

  notification:
    image: ${REGISTRY}/teamboard-notification:${TAG}

  plugin:
    image: ${REGISTRY}/teamboard-plugin:${TAG}
    environment:
      # Block webhooks to private/internal addresses (SSRF protection) on a public box.
      ALLOW_INSECURE_HTTP: "false"
      ALLOW_PRIVATE_URLS: "false"

  boardregistry:
    image: ${REGISTRY}/teamboard-boardregistry:${TAG}

  mcp-server:
    image: ${REGISTRY}/teamboard-mcp-server:${TAG}

  frontend:
    image: ${REGISTRY}/teamboard-frontend:${TAG}
    # Serve the SPA via Traefik with the lowest priority, so /api/* and /ws
    # (matched by the service routers) win and everything else falls to the SPA.
    labels:
      - traefik.enable=true
      - "traefik.http.routers.frontend.rule=PathPrefix(`/`)"
      - "traefik.http.routers.frontend.priority=1"
      - traefik.http.services.frontend.loadbalancer.server.port=3000

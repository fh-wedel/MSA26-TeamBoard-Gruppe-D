openapi: 3.1.0
info:
  title: TeamBoard Project Service
  version: 1.0.0
  description: >
    Projects, boards, columns, memberships and invitations. This service is the
    authoritative source for project permissions. Board types are resolved from
    the Board Registry service at board-creation time. All endpoints require a
    bearer JWT issued by the Auth service.
servers:
  - url: http://localhost/api/v1
    description: Via Traefik gateway
  - url: http://localhost:8002/api/v1
    description: Direct service port (when published)

security:
  - bearerAuth: []

tags:
  - name: projects
    description: Project CRUD
  - name: members
    description: Project memberships and roles
  - name: boards
    description: Boards and columns
  - name: invitations
    description: Project invitations

paths:
  /projects:
    get:
      summary: List projects the caller is a member of
      operationId: listProjects
      tags: [projects]
      responses:
        '200':
          description: Project list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectList' }
    post:
      summary: Create a project
      operationId: createProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateProjectRequest' }
      responses:
        '201':
          description: Created project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '400': { $ref: '#/components/responses/Problem' }

  /projects/{projectID}:
    parameters:
      - $ref: '#/components/parameters/projectID'
    get:
      summary: Get a project
      operationId: getProject
      tags: [projects]
      responses:
        '200':
          description: Project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Update a project
      operationId: updateProject
      tags: [projects]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProjectRequest' }
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ProjectResponse' }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Delete a project
      operationId: deleteProject
      tags: [projects]
      responses:
        '204': { description: Deleted }
        '403': { $ref: '#/components/responses/Problem' }
        '404': { $ref: '#/components/responses/Problem' }

  /projects/{projectID}/members:
    parameters:
      - $ref: '#/components/parameters/projectID'
    get:
      summary: List project members
      operationId: listMembers
      tags: [members]
      responses:
        '200':
          description: Member list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberList' }
    post:
      summary: Add a member
      operationId: addMember
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMemberRequest' }
      responses:
        '201':
          description: Member added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /projects/{projectID}/members/{userID}/role:
    parameters:
      - $ref: '#/components/parameters/projectID'
      - $ref: '#/components/parameters/userID'
    patch:
      summary: Change a member's role
      operationId: updateMemberRole
      tags: [members]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateMemberRoleRequest' }
      responses:
        '200':
          description: Updated member
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /projects/{projectID}/members/{userID}:
    parameters:
      - $ref: '#/components/parameters/projectID'
      - $ref: '#/components/parameters/userID'
    delete:
      summary: Remove a member
      operationId: removeMember
      tags: [members]
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/Problem' }
        '409': { $ref: '#/components/responses/Problem' }

  /projects/{projectID}/boards:
    parameters:
      - $ref: '#/components/parameters/projectID'
    get:
      summary: List boards in a project
      operationId: listBoards
      tags: [boards]
      responses:
        '200':
          description: Board list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardList' }
    post:
      summary: Create a board
      operationId: createBoard
      tags: [boards]
      description: >
        The board `type` is validated against and resolved from the Board
        Registry service. If no columns are supplied, the registry's default
        columns for the type are used.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateBoardRequest' }
      responses:
        '201':
          description: Created board
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardResponse' }
        '400': { $ref: '#/components/responses/Problem' }
        '503': { $ref: '#/components/responses/Problem' }

  /projects/{projectID}/invitations:
    parameters:
      - $ref: '#/components/parameters/projectID'
    get:
      summary: List invitations for a project
      operationId: listInvitations
      tags: [invitations]
      responses:
        '200':
          description: Invitation list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationList' }
    post:
      summary: Create an invitation
      operationId: createInvitation
      tags: [invitations]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateInvitationRequest' }
      responses:
        '201':
          description: Created invitation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationResponse' }
        '400': { $ref: '#/components/responses/Problem' }

  /invitations/{token}:
    parameters:
      - $ref: '#/components/parameters/token'
    get:
      summary: Look up an invitation by token
      operationId: getInvitation
      tags: [invitations]
      responses:
        '200':
          description: Invitation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InvitationResponse' }
        '404': { $ref: '#/components/responses/Problem' }

  /invitations/{token}/accept:
    parameters:
      - $ref: '#/components/parameters/token'
    post:
      summary: Accept an invitation
      operationId: acceptInvitation
      tags: [invitations]
      responses:
        '200':
          description: Membership created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MemberResponse' }
        '404': { $ref: '#/components/responses/Problem' }

  /invitations/{token}/decline:
    parameters:
      - $ref: '#/components/parameters/token'
    post:
      summary: Decline an invitation
      operationId: declineInvitation
      tags: [invitations]
      responses:
        '204': { description: Declined }
        '404': { $ref: '#/components/responses/Problem' }

  /boards/{boardID}:
    parameters:
      - $ref: '#/components/parameters/boardID'
    get:
      summary: Get a board
      operationId: getBoard
      tags: [boards]
      responses:
        '200':
          description: Board
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardResponse' }
        '404': { $ref: '#/components/responses/Problem' }
    patch:
      summary: Update a board
      operationId: updateBoard
      tags: [boards]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateBoardRequest' }
      responses:
        '200':
          description: Updated board
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BoardResponse' }
        '404': { $ref: '#/components/responses/Problem' }
    delete:
      summary: Delete a board
      operationId: deleteBoard
      tags: [boards]
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/Problem' }

  /boards/{boardID}/columns:
    parameters:
      - $ref: '#/components/parameters/boardID'
    get:
      summary: List columns of a board
      operationId: listColumns
      tags: [boards]
      responses:
        '200':
          description: Column list
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ColumnList' }
    post:
      summary: Create a column
      operationId: createColumn
      tags: [boards]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateColumnRequest' }
      responses:
        '201':
          description: Created column
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ColumnResponse' }
        '400': { $ref: '#/components/responses/Problem' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    projectID:
      in: path
      name: projectID
      required: true
      schema: { type: string, format: uuid }
    boardID:
      in: path
      name: boardID
      required: true
      schema: { type: string, format: uuid }
    userID:
      in: path
      name: userID
      required: true
      schema: { type: string, format: uuid }
    token:
      in: path
      name: token
      required: true
      schema: { type: string }

  responses:
    Problem:
      description: RFC 7807 problem details
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }

  schemas:
    Project:
      type: object
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        description: { type: string }
        owner_id: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }

    ProjectResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Project' }

    ProjectList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Project' }

    CreateProjectRequest:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }

    UpdateProjectRequest:
      type: object
      properties:
        name: { type: string }
        description: { type: string }

    Member:
      type: object
      properties:
        project_id: { type: string, format: uuid }
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        invited_by: { type: string, format: uuid, nullable: true }
        joined_at: { type: string, format: date-time }

    MemberResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Member' }

    MemberList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Member' }

    AddMemberRequest:
      type: object
      required: [role]
      description: Provide either user_id or email to identify the user.
      properties:
        user_id: { type: string, format: uuid }
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }

    UpdateMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role: { $ref: '#/components/schemas/Role' }

    Role:
      type: string
      enum: [owner, admin, member, viewer]

    Board:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        name: { type: string }
        type: { type: string, description: Board type slug resolved from the Board Registry }
        position: { type: integer }
        config:
          type: object
          additionalProperties: true
        created_by: { type: string, format: uuid }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        columns:
          type: array
          items: { $ref: '#/components/schemas/Column' }

    BoardResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Board' }

    BoardList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Board' }

    CreateBoardRequest:
      type: object
      required: [name, type]
      properties:
        name: { type: string }
        type: { type: string }
        config:
          type: object
          additionalProperties: true
        columns:
          type: array
          items: { $ref: '#/components/schemas/ColumnInput' }

    UpdateBoardRequest:
      type: object
      properties:
        name: { type: string }
        config:
          type: object
          additionalProperties: true

    Column:
      type: object
      properties:
        id: { type: string, format: uuid }
        board_id: { type: string, format: uuid }
        name: { type: string }
        position: { type: integer }
        wip_limit: { type: integer, nullable: true }
        status: { $ref: '#/components/schemas/ColumnStatus' }

    ColumnResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Column' }

    ColumnList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Column' }

    ColumnInput:
      type: object
      required: [name, position]
      properties:
        name: { type: string }
        position: { type: integer }
        wip_limit: { type: integer, nullable: true }
        status: { $ref: '#/components/schemas/ColumnStatus' }

    CreateColumnRequest:
      type: object
      required: [name, position]
      properties:
        name: { type: string }
        position: { type: integer }
        wip_limit: { type: integer, nullable: true }
        status: { $ref: '#/components/schemas/ColumnStatus' }

    ColumnStatus:
      type: string
      description: Semantic status carried by the column.
      enum: [open, in_progress, blocked, done, archived]

    Invitation:
      type: object
      properties:
        id: { type: string, format: uuid }
        project_id: { type: string, format: uuid }
        invitee_email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }
        token: { type: string }
        invited_by: { type: string, format: uuid }
        status: { type: string, enum: [pending, accepted, declined, expired] }
        created_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }

    InvitationResponse:
      type: object
      required: [data]
      properties:
        data: { $ref: '#/components/schemas/Invitation' }

    InvitationList:
      type: object
      required: [data]
      properties:
        data:
          type: array
          items: { $ref: '#/components/schemas/Invitation' }

    CreateInvitationRequest:
      type: object
      required: [email, role]
      properties:
        email: { type: string, format: email }
        role: { $ref: '#/components/schemas/Role' }

    Problem:
      type: object
      properties:
        type: { type: string }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        code: { type: string }
        trace_id: { type: string }
